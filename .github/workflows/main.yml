name: Build AVESON APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          if ! find . -name "build.gradle" -o -name "build.gradle.kts" | grep -q .; then
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
            if [ -n "$ZIP" ]; then
              mkdir -p extracted
              unzip -o "$ZIP" -d extracted
              cp -r extracted/*/* . 2>/dev/null || cp -r extracted/* .
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build AVESON APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload AVESON APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
